[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daaam"
authors = [
    {name = "Nicolas Gorlo", email = "ngorlo@mit.edu"}
]
description = "Describe Anything, Anywhere, at Any Moment (DAAAM)"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dynamic = ["version"]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115,<1",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "uvicorn>=0.30,<1",
]
query-ui = [
    "fastapi>=0.115,<1",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "uvicorn>=0.30,<1",
]

[project.urls]
Source = "https://github.com/MIT-SPARK/DAAAM"
Tracker = "https://github.com/MIT-SPARK/DAAAM/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
daaam = ["query_static/*.css", "query_static/*.html", "query_static/*.js"]
