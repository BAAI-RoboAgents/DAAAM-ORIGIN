source_frames:
  start: 815
  end: 915

repeats: 3
seeds: [0, 1, 2]

# Contiguous blocks prevent adjacent-frame leakage. Review and version these
# content labels before treating held_out as a formal untouched test split.
splits:
  calibration: [815, 829]
  development: [830, 869]
  stress: [870, 899]
  held_out: [900, 915]

# External model/report paths are expanded from the environment. The manager
# records empty/missing values as blockers instead of inventing provenance.
inputs:
  fast_foundation_repo: experiments/g1_semantic_map/shared_inputs/Fast-FoundationStereo-pinned
  fast_foundation_checkpoint: /home/user/Code/Fast-FoundationStereo/weights/20-30-48/model_best_bp2_serialize.pth
  foundation_stereo_checkpoint: /home/user/Code/FoundationStereo/pretrained_models/11-33-40/model_best_bp2.pth
  # Validated on pinhole_visual_only_selected with relaxed ROI distance bounds;
  # failed lidar-right attempt retained as floor_calibration_diagnostic.json.
  floor_calibration_report: experiments/g1_semantic_map/shared_inputs/floor_calibration_report.json
  right_rectification_report: experiments/g1_semantic_map/shared_inputs/right_rectification_lidar_815_915/lidar_guided_rectification_report.json
  fastsam_engine: checkpoints/fastsam/FastSAM-x-640x480.engine
  reid_engine: checkpoints/reid_weights/clip_general.engine
  dam_model: nvidia/DAM-3B

artifacts:
  # Formal prepared input: visual-right geometry-passing subset (78 frames; audit 57/57).
  # Prior lidar-right 01_pinhole (0/96 gate) is retained under offline_prepared/01_pinhole.
