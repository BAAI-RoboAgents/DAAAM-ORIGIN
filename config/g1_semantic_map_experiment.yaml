  odometry_dataset: experiments/g1_semantic_map/shared_inputs/offline_prepared_geometry_pass/05_rgbd_window_graph
  loop_report: experiments/g1_semantic_map/shared_inputs/offline_prepared_geometry_pass/06_loop_closures/loop_closure_report.json
  optimized_dataset: experiments/g1_semantic_map/shared_inputs/offline_prepared_geometry_pass/07_global_pose_graph
  filtered_dataset: experiments/g1_semantic_map/shared_inputs/offline_prepared_geometry_pass/08_temporal_depth_filtered
